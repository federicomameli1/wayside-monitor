name: WMS CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: wms-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pytest pytest-json-report

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short \
            --json-report --json-report-file=test-report.json

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wayside-test-report
          path: test-report.json

  notify-challenge-app:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger challenge-app analysis via repository_dispatch
        env:
          CHALLENGE_APP_REPO: ${{ vars.CHALLENGE_APP_REPO }}
          CHALLENGE_APP_TOKEN: ${{ secrets.CHALLENGE_APP_TOKEN }}
        run: |
          curl -s -f -X POST \
            -H "Authorization: Bearer $CHALLENGE_APP_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$CHALLENGE_APP_REPO/dispatches" \
            -d "{
              \"event_type\": \"wayside-monitor-push\",
              \"client_payload\": {
                \"repo\": \"${{ github.repository }}\",
                \"ref\": \"${{ github.sha }}\",
                \"subject_run_id\": \"${{ github.run_id }}\",
                \"test_conclusion\": \"${{ needs.test.result }}\"
              }
            }"
