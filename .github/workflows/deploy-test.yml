name: Main — Deploy to Test

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-test
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest-json-report
      - name: Run tests
        run: |
          pytest tests/ -v --tb=short \
            --json-report --json-report-file=test-report.json
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wayside-test-report-${{ github.sha }}
          path: test-report.json

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:main
            ghcr.io/${{ github.repository }}:${{ github.sha }}

  deploy-test:
    needs: build
    runs-on: ubuntu-latest
    environment: test           # ← gate umano via required reviewer
    steps:
      - name: Update gitops test values
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          GITOPS_REPO: ${{ vars.GITOPS_REPO }}
          SHA: ${{ github.sha }}
        run: |
          git clone "https://x-access-token:${GITOPS_TOKEN}@github.com/${GITOPS_REPO}.git" gitops
          cd gitops
          sed -i "s|^\([[:space:]]*tag:\).*|\1 \"${SHA}\"|" environments/test/values.yaml
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add environments/test/values.yaml
          if git diff --staged --quiet; then
            echo "No tag change; nothing to commit."
            exit 0
          fi
          git commit -m "chore: promote wayside-monitor to test@${SHA}"
          git push
