name: Verdict — LLM PR Review

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

concurrency:
  group: verdict-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write   # needed to post the review comment

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout wayside-monitor (PR head)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0       # need full history to compute diff vs base

      - name: Checkout verdict (for pr_review module)
        uses: actions/checkout@v4
        with:
          repository: federicomameli1/verdict
          ref: main
          path: .verdict-src
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install --no-cache-dir pydantic

      - name: Run Verdict PR review
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
          HF_EMBEDDING_MODEL: ${{ vars.HF_EMBEDDING_MODEL }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DOCS_DIR: docs
          OUTPUT_DIR: pr-review-output
          PYTHONPATH: ${{ github.workspace }}/.verdict-src
        run: python .github/scripts/run_pr_review.py

      - name: Upload review artifacts
        if: always() && hashFiles('pr-review-output/result.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: verdict-pr-review-${{ github.event.pull_request.number }}
          path: pr-review-output/

      - name: Post review as PR comment
        if: hashFiles('pr-review-output/report.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --body-file pr-review-output/report.md
