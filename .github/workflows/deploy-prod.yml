name: Release — Deploy to Prod

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: write           # serve a generate-vdd per committare in VDDs/
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest tests/ -v --tb=short

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release commit is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "${{ github.sha }}" origin/main; then
            echo "ERROR: Release tag is not reachable from main. Aborting."
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (digest-pinned)
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.event.release.tag_name }}

  deploy-prod:
    needs: build
    runs-on: ubuntu-latest
    environment: production         # ← gate umano via required reviewer
    steps:
      - name: Update gitops prod values (digest-pinned)
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          GITOPS_REPO: ${{ vars.GITOPS_REPO }}
          DIGEST: ${{ needs.build.outputs.digest }}
          TAG: ${{ github.event.release.tag_name }}
          IMAGE_REPO: ghcr.io/${{ github.repository }}
        run: |
          git clone "https://x-access-token:${GITOPS_TOKEN}@github.com/${GITOPS_REPO}.git" gitops
          cd gitops
          sed -i "s|^\([[:space:]]*repository:\).*|\1 ${IMAGE_REPO}@${DIGEST}|" environments/prod/values.yaml
          sed -i "s|^\([[:space:]]*tag:\).*|\1 \"\"|" environments/prod/values.yaml
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add environments/prod/values.yaml
          git commit -m "chore: release wayside-monitor ${TAG} to prod (${DIGEST})"
          git push

  generate-vdd:
    needs: deploy-prod
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout wayside-monitor (main, full history for diff)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout verdict (for vdd_drafter module)
        uses: actions/checkout@v4
        with:
          repository: federicomameli1/verdict
          ref: main
          path: .verdict-src
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --no-cache-dir pydantic

      - name: Run Verdict VDD Drafter
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          HEAD_SHA: ${{ github.sha }}
          SUBJECT_REPO: ${{ github.repository }}
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
          DOCS_DIR: docs
          OUTPUT_DIR: vdd-output
          PYTHONPATH: ${{ github.workspace }}/.verdict-src
        run: python .github/scripts/run_vdd_drafter.py

      - name: Upload VDD artifact
        if: always() && hashFiles('vdd-output/VDD.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: wayside-vdd-${{ github.event.release.tag_name }}
          path: vdd-output/

      - name: Commit VDD
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add VDDs/
          if git diff --staged --quiet; then
            echo "VDD already up to date"
            exit 0
          fi
          git commit -m "docs(vdd): add VDD for ${TAG}"
          git push origin main
