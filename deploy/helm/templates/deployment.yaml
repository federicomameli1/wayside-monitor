apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "wayside-monitor.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "wayside-monitor.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "wayside-monitor.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: app
          image: "{{ .Values.image.repository }}{{ if .Values.image.tag }}:{{ .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
          env:
            - name: COLLECTOR_STREAM
              value: {{ .Values.env.collector_stream | quote }}
            - name: ENGINE_STREAM
              value: {{ .Values.env.engine_stream | quote }}
            - name: ANOMALY_ENGINE_MODEL_VER
              value: {{ .Values.env.anomaly_engine_model_ver | quote }}
            - name: DEAD_LETTER_PATH
              value: {{ .Values.env.dead_letter_path | quote }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
